[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taskflow-agent"
version = "0.1.0"
description = "Autonomous AI agent for day-to-day task automation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Puneet Divedi", email = "sd9501242@gmail.com"}
]
dependencies = [
    "anthropic>=0.70.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31",
    "watchdog>=4.0.0",
    "pyyaml>=6.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5.0",
    "pre-commit>=3.5",
    "types-requests>=2.31",
    "types-PyYAML>=6.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
# addopts = "--cov=src --cov-report=term-missing --cov-fail-under=50"

[tool.coverage.run]
source = ["src"]
relative_files = true
omit = ["src/__init__.py", "src/logging_config.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if False:",  # TYPE_CHECKING workaround
    "class .*\\bProtocol\\b:",
]
